name: Publish extension zip

on:
  push:
    paths:
      - "release/*.zip"

permissions:
  contents: write

jobs:
  upload:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Attach the zip to the latest release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag=$(gh release view --json tagName --jq .tagName)
          zip=$(ls release/*.zip | head -1)
          gh release upload "$tag" "$zip" --clobber
