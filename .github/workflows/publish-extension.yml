name: Publish extension zip

on:
  push:
    branches: [main]
    paths:
      - "release/*.zip"

permissions:
  contents: write

jobs:
  upload:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Create or update the release for the newest zip
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          # The highest version in release/, e.g. ghosty-extension-v0.1.1-chrome.zip -> v0.1.1.
          # Older zips were named truly-extension-v*; both are read.
          zip=$(ls release/*-extension-v*-chrome.zip | awk -F'-extension-' '{print $2" "$0}' | sort -V | tail -1 | cut -d' ' -f2)
          tag=$(basename "$zip" | sed -E 's/^(ghosty|truly)-extension-(v[0-9][0-9.]*)-chrome\.zip$/\2/')
          if gh release view "$tag" >/dev/null 2>&1; then
            gh release upload "$tag" "$zip" --clobber
          else
            gh release create "$tag" "$zip" \
              --title "Ghosty $tag" \
              --target "$GITHUB_SHA" \
              --latest \
              --notes "Ghosty $tag for Chrome. Download the zip, unzip it, open chrome://extensions, turn on Developer mode, click Load unpacked and pick the unzipped folder. See the README for what is new."
          fi
